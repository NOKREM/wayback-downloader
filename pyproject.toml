[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayback-downloader"
version = "1.0.0"
description = "CLI downloader for Esri Living Atlas World Imagery Wayback historical satellite imagery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "diskcache>=5.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
geo = ["mercantile>=1.2", "pyproj>=3.6", "shapely>=2.0", "rasterio>=1.3"]
video = ["imageio[ffmpeg]>=2.34"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "black>=24.4", "mypy>=1.10", "respx>=0.21"]

[project.scripts]
wayback = "wayback_downloader.cli:app"

[tool.setuptools.packages.find]
include = ["wayback_downloader*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["wayback_downloader/tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
